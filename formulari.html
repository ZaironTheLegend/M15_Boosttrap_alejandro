<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari de contacte | Zairon Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root {
            --page-bg: #f3f6fb;
            --nav-bg: #17233c;
            --accent: #5271ff;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f8faff 0%, var(--page-bg) 55%, #e9efff 100%);
            color: #202b40;
        }

        .site-navbar {
            background-color: var(--nav-bg);
            box-shadow: 0 4px 18px rgba(20, 33, 61, 0.14);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .navbar-brand img {
            object-fit: contain;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.75);
        }

        .nav-link:hover,
        .nav-link.active {
            color: #fff;
        }

        .page-content {
            max-width: 860px;
        }

        .form-card {
            border: 0;
            border-radius: 1.25rem;
            box-shadow: 0 18px 55px rgba(29, 49, 88, 0.12);
        }

        .form-card .card-body {
            padding: clamp(1.5rem, 5vw, 3rem);
        }

        .page-kicker {
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .form-label,
        legend {
            color: #293650;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border-color: #dce3ef;
            border-radius: 0.7rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 0.22rem rgba(82, 113, 255, 0.15);
        }

        textarea.form-control {
            min-height: 130px;
        }

        .gender-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1.5rem;
        }

        .form-check-input:checked {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .submit-button {
            min-height: 48px;
            border: 0;
            border-radius: 0.7rem;
            background: linear-gradient(110deg, #5271ff, #7655df);
            font-weight: 600;
        }

        .submit-button:hover {
            background: linear-gradient(110deg, #405fe9, #6746cb);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="inici.html">
                <img src="img/Zairon.png" alt="Logo de Zairon" width="32" height="28">
                Zairon Bootstrap
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Obre el menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto ms-lg-4 mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Projecte</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="stands.html">Stands</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Més
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="contactes.html">Contactes</a></li>
                            <li><a class="dropdown-item active" aria-current="page" href="formulari.html">Formulari</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Cerca" aria-label="Cerca">
                    <button class="btn btn-outline-light" type="submit">Cerca</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container page-content py-5">
        <div class="text-center mb-4 mb-md-5">
            <p class="page-kicker mb-2">Estem aquí per ajudar-te</p>
            <h1 class="display-6 fw-bold mb-2">Formulari de contacte</h1>
            <p class="text-secondary mb-0">Omple les teves dades i ens posarem en contacte amb tu.</p>
        </div>

        <section class="card form-card">
            <div class="card-body">
                <form id="formulari" onsubmit="cridaSubmit1(event)">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="nom" class="form-label">Nom</label>
                            <input class="form-control" type="text" id="nom" name="nom" placeholder="El teu nom" required>
                        </div>
                        <div class="col-12">
                            <label for="cognom" class="form-label">Cognom</label>
                            <input class="form-control" type="text" id="cognom" name="cognom" placeholder="El teu cognom" required>
                        </div>
                        <div class="col-12">
                            <label for="correu" class="form-label">Correu electrònic</label>
                            <input type="email" class="form-control" id="correu" name="correu" placeholder="nom@exemple.com" required>
                        </div>
                        <div class="col-12">
                            <label for="dataNaixement" class="form-label">Data de naixement</label>
                            <input type="date" class="form-control" id="dataNaixement" name="dataNaixement" aria-describedby="dateHelp" required>
                            <div id="dateHelp" class="form-text">Escriu la teva data de naixement.</div>
                        </div>
                        <fieldset class="col-12">
                            <legend class="form-label fs-6 mb-2">Gènere</legend>
                            <div class="gender-options">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="genero" id="generoHombre" value="hombre" required>
                                    <label class="form-check-label" for="generoHombre">Hombre</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="genero" id="generoMujer" value="mujer" required>
                                    <label class="form-check-label" for="generoMujer">Mujer</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="genero" id="generoNoResponder" value="prefiero-no-responder" required>
                                    <label class="form-check-label" for="generoNoResponder">Prefiero no responder</label>
                                </div>
                            </div>
                        </fieldset>
                        <div class="col-12">
                            <label class="form-label" for="preferencia">Preferencia</label>
                            <select class="form-select" id="preferencia" name="preferencia">
                                <option selected>Selecciona una opción</option>
                                <option value="1">Hermit Purple</option>
                                <option value="2">Star Platinum</option>
                                <option value="3">The World</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="comentarios">Comentarios</label>
                            <textarea class="form-control" placeholder="Escribe aquí tu mensaje..." id="comentarios" name="comentarios"></textarea>
                        </div>
                        <div class="col-12 pt-2">
                            <button type="submit" class="btn btn-primary submit-button w-100">Confirma</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
